name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -v

      - name: Static security scan (Bandit)
        run: bandit -r . -x ./tests -ll

      - name: Detection-quality gate (rules layer, no API key needed)
        # Fails the build if a rule change makes detection worse.
        run: python eval/run_eval.py --mode rules --no-write --min-recall 0.38 --max-fpr 0.30

      - name: Dependency vulnerability audit (pip-audit)
        # Non-blocking: advisories in transitive deps are reported, not fatal.
        continue-on-error: true
        run: pip-audit -r requirements.txt
