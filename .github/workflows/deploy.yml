# Manual deploy to AWS using GitHub's OIDC identity — no AWS access keys are stored in GitHub.
# One-time setup is in DEPLOY.md, "Optional: deploy from GitHub Actions".
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets GitHub request a short-lived OIDC token for AWS

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - run: npm ci
      - run: python ../scripts/build_lambda.py
      - run: npx cdk deploy --require-approval never -c frontendUrls="${{ vars.FRONTEND_URLS }}"
